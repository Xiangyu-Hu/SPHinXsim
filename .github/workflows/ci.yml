name: CI

on:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/**" #check self before pushing
      - "examples/**"
      - "tests/**"
      - "sphinxsim/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "*.cmake"
      - "pyproject.toml"
  pull_request:
    branches: [main, master]
    paths:
      - ".github/workflows/**" #check self before pushing
      - "examples/**"
      - "tests/**"
      - "sphinxsim/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "*.cmake"
      - "pyproject.toml"
  workflow_dispatch:

env:
  VCPKG_VERSION: "2026.04.27"

jobs:
  build-and-test-linux:
    name: build-and-test (linux)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      VCPKG_DEFAULT_TRIPLET: x64-linux
      SPHINXSIM_LLM_PROVIDER: mock
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up CMake
        run: python -m pip install cmake==4.2.3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            apt-utils \
            build-essential \
            curl zip unzip tar \
            pkg-config \
            git \
            ninja-build \
            python3-dev \
            autoconf automake autoconf-archive \
            libxmu-dev libxi-dev libgl-dev libxt-dev \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 \
            xvfb xauth libgl1-mesa-dri libegl1 libopengl0

      - name: Verify Qt display before native compilation
        env:
          QT_QPA_PLATFORM: xcb
          QT_DEBUG_PLUGINS: "1"
        run: |
          python -m pip install 'PySide6>=6.5'
          xvfb-run -a -s "-screen 0 1600x1000x24" python -c \
            'from PySide6.QtWidgets import QApplication; app = QApplication([]); print("Qt display:", app.platformName())'

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}-${{ runner.os }}

      - name: Set up vcpkg
        uses: friendlyanon/setup-vcpkg@v1
        with:
          committish: ${{ env.VCPKG_VERSION }}
          cache-version: ${{ env.VCPKG_VERSION }}

      - name: Install C++ dependencies via vcpkg
        run: |
          ${{ github.workspace }}/vcpkg/vcpkg install --clean-after-build \
            eigen3 \
            tbb \
            boost-program-options \
            boost-geometry \
            simbody \
            spdlog \
            gtest \
            pybind11 \
            nlohmann-json

      - name: Configure CMake (integrated build)
        run: |
          cmake --preset integrated-build-release \
            -D CMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -D CMAKE_C_COMPILER_LAUNCHER=ccache \
            -D CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -D Python3_EXECUTABLE=$(which python3)

      - name: Build
        run: |
          cmake --build --preset integrated-build-release \
            --parallel $(nproc)

      - name: Run C++ simulation class tests (ctest)
        run: |
          ctest --test-dir ${{ github.workspace }}/build-integrated \
            --output-on-failure \
            -L "simulation_class"

      - name: Install Python package (editable with dev dependencies)
        run: |
          export CMAKE_ARGS="-D CMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
          pip install -e ".[dev,cad,mcp,results,visualization]"

      - name: Run unit tests (tests/, including native operations)
        env:
          SPHINXSIM_REQUIRE_NATIVE_TESTS: "1"
        run: |
          pytest tests/ -v

      - name: Test real native desktop and screenshot on a CPU display
        env:
          SPHINXSIM_REQUIRE_NATIVE_TESTS: "1"
          SPHINXSIM_DESKTOP_TESTS: "1"
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" pytest tests/runtime/test_desktop.py -v -s

      - name: Run example tests (examples/)
        run: |
          pytest examples/ -v

  build-and-test-windows:
    name: build-and-test (windows)
    runs-on: windows-2022
    permissions:
      contents: read
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      SPHINXSIM_LLM_PROVIDER: mock
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up CMake
        run: python -m pip install cmake==4.2.3

      - name: Set up ccache
        # Caching is optional; build and tests still run if its download fails.
        continue-on-error: true
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}-${{ runner.os }}

      - name: Install Windows build tools
        shell: pwsh
        run: |
          python -m pip install ninja==1.13.2
          $ninjaBin = python -c 'import ninja; print(ninja.BIN_DIR)'
          $ninjaBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $ninjaBin 'ninja.exe') --version

      - name: Set up vcpkg
        uses: friendlyanon/setup-vcpkg@v1
        with:
          committish: ${{ env.VCPKG_VERSION }}
          cache-version: ${{ env.VCPKG_VERSION }}-windows

      - name: Install C++ dependencies via vcpkg (Windows)
        shell: pwsh
        run: |
          $vcpkg = "${{ github.workspace }}\\vcpkg\\vcpkg.exe"
          & $vcpkg install --clean-after-build `
            eigen3 `
            tbb `
            boost-program-options `
            boost-geometry `
            simbody `
            spdlog `
            gtest `
            pybind11 `
            nlohmann-json

      - name: Set up MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake (Windows)
        shell: pwsh
        run: |
          $pythonExe = python -c 'import sys; print(sys.executable)'
          $ccache = Get-Command ccache -CommandType Application -ErrorAction SilentlyContinue
          $ccacheExe = if ($ccache) { $ccache.Source } else { '' }
          cmake --preset integrated-build-release-windows `
            -D CMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -D CMAKE_C_COMPILER_LAUNCHER="$ccacheExe" `
            -D CMAKE_CXX_COMPILER_LAUNCHER="$ccacheExe" `
            -D Python3_EXECUTABLE="$pythonExe"

      - name: Build (Windows)
        shell: pwsh
        run: |
          cmake --build --preset integrated-build-release-windows --parallel

      - name: Run C++ simulation class tests (Windows)
        shell: pwsh
        run: |
          ctest --test-dir "${{ github.workspace }}\\build-integrated" `
            --output-on-failure `
            -L "simulation_class"

      - name: Install Python package (editable with dev dependencies)
        shell: pwsh
        run: |
          $toolchain = "${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake" -replace '\\', '/'
          $env:CMAKE_ARGS = "-D CMAKE_TOOLCHAIN_FILE=$toolchain"
          pip install -e ".[dev]"

      - name: Install Qt preview dependencies (Windows)
        shell: pwsh
        run: |
          pip install pyvistaqt PySide6

      - name: Smoke test pyvistaqt BackgroundPlotter import (Windows)
        shell: pwsh
        run: |
          python -c "from pyvistaqt import BackgroundPlotter; print('BackgroundPlotter import OK')"

      - name: Run unit tests (tests/, CI mock-LLM-only)
        env:
          SPHINXSIM_LLM_PROVIDER: mock
        run: |
          pytest tests/ -v -k "not ollama"

      - name: Run example tests (examples/)
        run: |
          pytest examples/ -v

  build-and-test-macos:
    name: build-and-test (macos)
    runs-on: macos-15
    permissions:
      contents: read
    env:
      VCPKG_DEFAULT_TRIPLET: arm64-osx
      SPHINXSIM_LLM_PROVIDER: mock
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up CMake
        run: python -m pip install cmake==4.2.3

      - name: Install macOS system dependencies
        run: |
          brew update
          brew install ninja autoconf automake autoconf-archive libtool pkg-config

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}-${{ runner.os }}

      - name: Set up vcpkg
        uses: friendlyanon/setup-vcpkg@v1
        with:
          committish: ${{ env.VCPKG_VERSION }}
          cache-version: ${{ env.VCPKG_VERSION }}-macos

      - name: Install C++ dependencies via vcpkg (macOS)
        run: |
          ${{ github.workspace }}/vcpkg/vcpkg install --clean-after-build \
            eigen3 \
            tbb \
            boost-program-options \
            boost-geometry \
            simbody \
            spdlog \
            gtest \
            pybind11 \
            nlohmann-json

      - name: Configure CMake (macOS)
        run: |
          cmake --preset integrated-build-release \
            -D CMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -D CMAKE_C_COMPILER_LAUNCHER=ccache \
            -D CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -D Python3_EXECUTABLE=$(which python3)

      - name: Build (macOS)
        run: |
          cmake --build --preset integrated-build-release --parallel "$(sysctl -n hw.logicalcpu)"

      - name: Run C++ simulation class tests (macOS)
        run: |
          ctest --test-dir ${{ github.workspace }}/build-integrated \
            --output-on-failure \
            -L "simulation_class"

      - name: Install Python package (editable with dev dependencies)
        run: |
          export CMAKE_ARGS="-D CMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
          pip install -e ".[dev]"

      - name: Run unit tests (tests/, CI mock-LLM-only)
        env:
          SPHINXSIM_LLM_PROVIDER: mock
        run: |
          pytest tests/ -v -k "not ollama"

      - name: Run example tests (examples/)
        run: |
          pytest examples/ -v

  build-and-test-linux-sycl:
    name: build-and-test (linux, sycl)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      VCPKG_DEFAULT_TRIPLET: x64-linux
      SPHINXSIM_LLM_PROVIDER: mock
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up CMake
        run: python -m pip install cmake==4.2.3

      - name: Install system dependencies and Intel oneAPI
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            apt-utils \
            build-essential \
            curl zip unzip tar \
            pkg-config \
            git \
            ninja-build \
            python3-dev \
            autoconf automake autoconf-archive \
            libxmu-dev libxi-dev libgl-dev libxt-dev
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-cpp-essentials

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}-${{ runner.os }}

      - name: Set up vcpkg
        uses: friendlyanon/setup-vcpkg@v1
        with:
          committish: ${{ env.VCPKG_VERSION }}
          cache-version: ${{ env.VCPKG_VERSION }}-sycl

      - name: Install C++ dependencies via vcpkg
        run: |
          ${{ github.workspace }}/vcpkg/vcpkg install --clean-after-build \
            openblas[dynamic-arch] --allow-unsupported
          ${{ github.workspace }}/vcpkg/vcpkg install --clean-after-build \
            eigen3 \
            tbb \
            boost-program-options \
            boost-geometry \
            simbody \
            spdlog \
            gtest \
            pybind11 \
            nlohmann-json

      - name: Configure CMake (SYCL CPU backend)
        run: |
          PYTHON_EXE=$(which python3)
          source /opt/intel/oneapi/setvars.sh --include-intel-llvm
          cmake --preset sycl-cpu-binding \
            -D CMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -D CMAKE_C_COMPILER_LAUNCHER=ccache \
            -D CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -D Python3_EXECUTABLE="$PYTHON_EXE"

      - name: Build (SYCL CPU)
        run: |
          source /opt/intel/oneapi/setvars.sh --include-intel-llvm
          cmake --build --preset sycl-cpu-binding \
            --parallel $(nproc) \
            --verbose

      - name: Run C++ simulation class tests (SYCL CPU)
        run: |
          source /opt/intel/oneapi/setvars.sh --include-intel-llvm
          ctest --test-dir ${{ github.workspace }}/build-integrated \
            --output-on-failure --timeout 1000 \
            -L "simulation_class"

      - name: Install Python package (editable with dev dependencies)
        run: |
          PYTHON_EXE=$(which python3)
          source /opt/intel/oneapi/setvars.sh --include-intel-llvm
          export CMAKE_ARGS="-D CMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake -D CMAKE_C_COMPILER=icx -D CMAKE_CXX_COMPILER=icpx -D CMAKE_C_COMPILER_LAUNCHER=ccache -D CMAKE_CXX_COMPILER_LAUNCHER=ccache -D SPHINXSYS_USE_SYCL=ON"
          "$PYTHON_EXE" -m pip install -e ".[dev]"

      - name: Run unit tests (tests/)
        run: |
          source /opt/intel/oneapi/setvars.sh --include-intel-llvm
          pytest tests/ -v

      - name: Run example tests (examples/)
        run: |
          source /opt/intel/oneapi/setvars.sh --include-intel-llvm
          pytest examples/ -v

  wheel-smoke:
    name: wheel-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            vcpkg_triplet: x64-linux
          - os: windows-2022
            vcpkg_triplet: x64-windows
          - os: macos-15
            vcpkg_triplet: arm64-osx
    env:
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.vcpkg_triplet }}
      SPHINXSIM_LLM_PROVIDER: mock
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up CMake
        run: python -m pip install cmake==4.2.3

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            apt-utils \
            build-essential \
            curl zip unzip tar \
            pkg-config \
            git \
            ninja-build \
            python3-dev \
            autoconf automake autoconf-archive \
            libxmu-dev libxi-dev libgl-dev libxt-dev \
            libxcb-cursor0

      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install ninja autoconf automake autoconf-archive libtool pkg-config

      - name: Install Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install ninja==1.13.2
          $ninjaBin = python -c 'import ninja; print(ninja.BIN_DIR)'
          $ninjaBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $ninjaBin 'ninja.exe') --version

      - name: Set up vcpkg
        uses: friendlyanon/setup-vcpkg@v1
        with:
          committish: ${{ env.VCPKG_VERSION }}
          cache-version: ${{ env.VCPKG_VERSION }}-${{ runner.os }}-wheel

      - name: Install C++ dependencies via vcpkg (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          ${{ github.workspace }}/vcpkg/vcpkg install --clean-after-build \
            eigen3 \
            tbb \
            boost-program-options \
            boost-geometry \
            simbody \
            spdlog \
            gtest \
            pybind11 \
            nlohmann-json

      - name: Install C++ dependencies via vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkg = "${{ github.workspace }}\vcpkg\vcpkg.exe"
          & $vcpkg install --clean-after-build `
            eigen3 `
            tbb `
            boost-program-options `
            boost-geometry `
            simbody `
            spdlog `
            gtest `
            pybind11 `
            nlohmann-json

      - name: Set up MSVC developer command prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build wheel with pip (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          export CMAKE_ARGS="-D CMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
          python -m pip wheel --no-deps . -w dist

      - name: Build wheel with pip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $toolchain = "${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake" -replace '\\', '/'
          $env:CMAKE_ARGS = "-D CMAKE_TOOLCHAIN_FILE=$toolchain -D CMAKE_C_COMPILER=cl -D CMAKE_CXX_COMPILER=cl"
          python -m pip wheel --no-deps . -w dist

      - name: Install built wheel (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          python -m pip install --force-reinstall dist/sphinxsim-*.whl

      - name: Install built wheel (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wheel = Get-ChildItem "dist\sphinxsim-*.whl" | Select-Object -First 1
          if (-not $wheel) {
            throw "No sphinxsim wheel file found in dist/"
          }
          python -m pip install --force-reinstall $wheel.FullName

      - name: Smoke test wheel import and CLI
        run: |
          python -c "import os,tempfile; d=tempfile.mkdtemp(); os.chdir(d); from sphinxsim.bindings.loader import load_sphinxsys_core; m=load_sphinxsys_core(); print('Loaded extension:', m.__name__)"
          sphinxsim --help
          python -c "import os,tempfile,subprocess,sys,json; from importlib.metadata import distribution; d=tempfile.mkdtemp(); os.chdir(d); assert [e.name for e in distribution('sphinxsim').entry_points if e.group=='console_scripts']==['sphinxsim']; r=subprocess.run([sys.executable,'-m','sphinxsim','capabilities','--json'],capture_output=True,text=True,check=True); c=json.loads(r.stdout)['data']; assert 'loft' in c['modeling']['operations']; assert any(m['name']=='j2_plasticity' for m in c['capabilities']['materials'])"
