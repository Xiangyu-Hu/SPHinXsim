[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sphinxsim-agent"
version = "0.1.0"
description = "Host-neutral CLI and MCP integration for SPHinXsim"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.21", "pydantic>=2", "jsonschema>=4.23"]

[project.optional-dependencies]
mcp = ["mcp==1.30.0"]
export = ["vtk>=9.3,<9.5", "manifold3d>=3.2,<4"]
cad = ["cadquery==2.6.1"]
desktop = ["pyvista==0.46.4", "pyvistaqt==0.11.3", "PySide6==6.8.3", "QtPy==2.4.3"]

[project.scripts]
sphinxsim-agent = "sphinxsim_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sphinxsim_agent = ["schemas/*.json"]
