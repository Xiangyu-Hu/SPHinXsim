<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPHinXsim</title>
  <link rel="stylesheet" href="chat.css">
</head>
<body>
  <main class="app-shell">
    <section class="conversation" id="conversation" aria-live="polite">
      <div class="empty-state" id="empty-state">
        <h1>SPHinXsim</h1>
        <p>What would you like to talk about?</p>
      </div>
    </section>
    <div class="status" id="status" aria-live="polite"></div>
    <form class="composer" id="composer">
      <textarea id="message-input" rows="1" placeholder="Ask SPHinXsim" aria-label="Message"></textarea>
      <button id="send-button" type="submit" aria-label="Send message" disabled>↑</button>
    </form>
  </main>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="chat.js"></script>
</body>
</html>
